<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <!-- Highlight.js for code syntax highlighting (full bundle) -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
        id="hljs-theme">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- Mermaid for diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <!-- html2pdf.js for PDF export -->
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
</head>

<body>
    <!-- Header -->
    <header id="appHeader">
        <div class="header-left">
            <div class="logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                MD Viewer
            </div>
        </div>
        <div class="header-center">
            <div class="search-box" id="searchBox">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="搜尋檔案內容… (Ctrl+K)" autocomplete="off">
                <kbd class="search-kbd">Ctrl+K</kbd>
            </div>
        </div>
        <div class="header-right">
            <!-- Export PDF Button -->
            <button id="exportPdfBtn" class="btn-icon" title="匯出 PDF">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <polyline points="9 15 12 18 15 15"></polyline>
                </svg>
            </button>
            <!-- Recent Files Button -->
            <button id="recentFilesBtn" class="btn-icon" title="最近開啟">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </button>
            <!-- Theme Toggle -->
            <button id="themeToggle" class="btn-icon" title="切換主題">
                <svg id="themeIconDark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg id="themeIconLight" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" style="display:none">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="app-layout">
        <!-- Sidebar: File Tree -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">檔案總管</span>
                <button id="openFolderBtn" class="btn-icon btn-small" title="開啟資料夾">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                        </path>
                    </svg>
                </button>
            </div>
            <div class="file-tree" id="fileTree">
                <div class="tree-empty">
                    <p>尚未開啟資料夾</p>
                    <p class="hint">點擊上方按鈕選擇資料夾</p>
                </div>
            </div>
        </aside>

        <!-- Sidebar Resizer -->
        <div class="gutter gutter-sidebar" id="sidebarResizer"></div>

        <!-- Content Area -->
        <section class="content-area" id="contentArea">
            <!-- Tab Bar -->
            <div class="tab-bar" id="tabBar">
                <div class="tab-list" id="tabList"></div>
                <div class="tab-actions">
                    <button id="closeAllTabsBtn" class="btn-icon btn-small" title="關閉所有標籤" style="display:none">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Markdown Preview -->
            <div class="preview-container" id="previewContainer">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <h2>歡迎使用 MD Viewer</h2>
                    <p>選擇左側資料夾開始瀏覽 Markdown 檔案</p>
                    <!-- Recent Files in Welcome Screen -->
                    <div class="welcome-recent" id="welcomeRecent" style="display:none">
                        <h3>最近開啟</h3>
                        <div id="welcomeRecentList"></div>
                    </div>
                </div>
                <article class="markdown-body" id="markdownBody" style="display:none"></article>
            </div>

            <!-- Search Results Panel -->
            <div class="search-panel" id="searchPanel" style="display:none">
                <div class="search-panel-header">
                    <span>搜尋結果</span>
                    <button id="closeSearchPanel" class="btn-icon btn-small" title="關閉">✕</button>
                </div>
                <div class="search-results" id="searchResults"></div>
            </div>
        </section>

        <!-- TOC Resizer -->
        <div class="gutter gutter-toc" id="tocResizer"></div>

        <!-- TOC Sidebar -->
        <aside class="toc-sidebar" id="tocSidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">文件大綱</span>
            </div>
            <div class="toc-search" id="tocSearchBox">
                <input type="text" id="tocSearchInput" placeholder="篩選大綱…" autocomplete="off">
            </div>
            <nav class="toc-nav" id="tocNav">
                <div class="tree-empty">
                    <p>尚無大綱</p>
                </div>
            </nav>
        </aside>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar" id="statusBar">
        <div class="status-left">
            <span id="statusFile" class="status-item">未開啟檔案</span>
        </div>
        <div class="status-right">
            <span id="statusWords" class="status-item" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 7V4h16v3"></path>
                    <path d="M9 20h6"></path>
                    <path d="M12 4v16"></path>
                </svg>
                <span id="statusWordCount">0</span> 字
            </span>
            <span id="statusLines" class="status-item" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="17" y1="10" x2="3" y2="10"></line>
                    <line x1="21" y1="6" x2="3" y2="6"></line>
                    <line x1="21" y1="14" x2="3" y2="14"></line>
                    <line x1="17" y1="18" x2="3" y2="18"></line>
                </svg>
                <span id="statusLineCount">0</span> 行
            </span>
            <span id="statusModified" class="status-item" style="display:none">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="statusModTime"></span>
            </span>
        </div>
    </footer>

    <!-- Folder Path Input Modal -->
    <div class="modal-overlay" id="folderModal" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <h3>開啟資料夾</h3>
                <button class="btn-icon btn-small" id="closeFolderModal">✕</button>
            </div>
            <div class="modal-body">
                <label for="folderPathInput">輸入資料夾路徑：</label>
                <input type="text" id="folderPathInput" placeholder="例如：D:/Projects/docs" autocomplete="off">
                <!-- Recent folders -->
                <div class="recent-folders" id="recentFolders" style="display:none">
                    <label>最近開啟的資料夾：</label>
                    <div id="recentFolderList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" id="cancelFolderBtn">取消</button>
                <button class="btn btn-primary" id="confirmFolderBtn">開啟</button>
            </div>
        </div>
    </div>

    <!-- Recent Files Dropdown -->
    <div class="dropdown-panel" id="recentPanel" style="display:none">
        <div class="dropdown-header">
            <span>最近開啟的檔案</span>
            <button id="clearRecentBtn" class="btn-text">清除</button>
        </div>
        <div class="dropdown-list" id="recentList"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
